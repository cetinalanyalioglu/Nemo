# FNS Flow Network model definition
#
# Element library for the FNS compressible flow-network solver
# (~/Projects/FNS).  Networks built with this model and saved from the UI are
# read directly by the solver:
#
#     from fns.io import load_case
#     solution = load_case("<saved-case>.yaml").solve()
#
# Conventions matching the solver:
#   - All solution variables live on EDGES; each edge needs its flow area.
#   - Edge direction (source -> target) is only a sign convention: a negative
#     mass flow in the results means the gas runs against the drawn arrow.
#   - Every element contributes exactly one equation per port.  PORTS ARE
#     SIGNIFICANT: for a two-port element the target side is port 0 and the
#     source side is port 1 (the LossElement references its dynamic head to the
#     port-0 area; junction/splitter use port 0 as the common-pressure
#     reference).  The solver reads the port ordinals from each edge's
#     source/target handles, so keep handles attached to the intended ports.
#   - JunctionStaticP is valid only where all ports run at low Mach number; use
#     LosslessSplitter for plenums/manifolds feeding fast branches.
#
# Scope: v1 is subsonic (flowing or quiescent).  Supersonic inlets/outlets are
# deferred and intentionally omitted from this library.  The Duct element is
# length-bearing: its mean-flow face is a lossless constant-area passage, and
# its length feeds the acoustic (perturbation) analysis.
#
# Model-level parameters (Model pane) hold the thermo model, the gas properties
# and the reference scales used by the solver for nondimensionalization.  The
# "Thermo model" selector switches between a calorically-perfect gas (R, gamma)
# and the reacting equilibrium model.  The species thermochemistry comes from the
# built-in NASA Glenn / CEA database (no file to supply).  For the reacting model:
#   - give every inlet / mass source an explicit Composition (e.g.
#     "O2:0.21, N2:0.79" or "CH4:1.0") on a mole or mass basis;
#   - leave Species on "auto" to derive the product slate from those feeds, or list
#     the species explicitly;
#   - drop an Equilibrium Flame where the mixture ignites -- edges default to the
#     "Auto" closure (frozen upstream of a flame, equilibrium downstream); set an
#     edge's closure explicitly to override.
# Composition / basis fields and the edge closure apply only to the equilibrium
# model; they are hidden (via a model-scoped visibleIf on "Thermo model") and
# ignored when the perfect-gas model is selected.

id: fns-flow-network
name: FNS Flow Network
description: Compressible flow-network element library for the FNS solver (mean flow + acoustics).
forceUniqueNodeLabels: true

parameters:
  thermoModel:
    label: Thermo model
    type: select
    defaultValue: perfect_gas
    category: Gas
    description: >-
      Thermodynamic model for the whole network. "Perfect gas" is a single
      calorically-perfect gas (constant R and gamma). "Equilibrium (reacting)"
      transports the feed-stream mixture fractions and slaves the species to
      chemical (HP) equilibrium; it uses the built-in thermochemistry database and
      needs an explicit composition on every inlet / mass source.
    options:
      - {value: perfect_gas, label: Perfect gas}
      - {value: equilibrium, label: Equilibrium (reacting)}
  gasConstant:
    label: Specific gas constant R
    type: float
    defaultValue: 287.0
    unit: J/(kg K)
    category: Gas
    min: 1
    description: Specific gas constant of the working gas
    visibleIf: {parameter: thermoModel, equals: perfect_gas}
  heatCapacityRatio:
    label: Heat capacity ratio
    type: float
    defaultValue: 1.4
    category: Gas
    min: 1.001
    max: 1.999
    step: 0.01
    description: cp/cv of the working gas (calorically perfect)
    visibleIf: {parameter: thermoModel, equals: perfect_gas}
  species:
    label: Species
    type: string
    defaultValue: auto
    category: Gas
    description: >-
      Species to model, from the built-in NASA Glenn / CEA database. Leave "auto"
      (the default) to derive the product slate automatically from the feed
      compositions -- every species reachable from the fed-in elements, trimmed to
      those that are non-trace at equilibrium. Or give an explicit comma-separated
      list, e.g. "CH4, O2, N2, CO2, H2O, OH, H, O". Condensed feeds (e.g. a liquid
      fuel like "Jet-A(L)") are allowed in the composition and contribute their
      enthalpy; equilibrium products are gas-phase.
    visibleIf: {parameter: thermoModel, equals: equilibrium}
  referencePressure:
    label: Reference pressure
    type: float
    defaultValue: 101325.0
    unit: Pa
    category: References
    min: 1
    description: Pressure scale used for nondimensionalization and initialization
  referenceTemperature:
    label: Reference temperature
    type: float
    defaultValue: 300.0
    unit: K
    category: References
    min: 1
    description: Temperature scale used for nondimensionalization and initialization
  referenceMassFlow:
    label: Reference mass flow
    type: float
    defaultValue: 0.0
    unit: kg/s
    category: References
    min: 0
    description: >-
      Mass-flow scale for nondimensionalization. Leave 0 to derive it
      automatically (largest specified mass flow, else a Mach-0.3 estimate on
      the median edge area).

edges:
  flow:
    displayName: Flow Edge
    category: Flow Connections
    parameters:
      area:
        label: Area
        type: float
        unit: m^2
        category: Parameters
        min: 0.000001
        required: true
        description: Cross-sectional flow area at this port surface (must be supplied)
        editable: true
        visible: true
      thermoModel:
        label: Closure (reacting)
        type: select
        defaultValue: auto
        category: Reacting
        description: >-
          Per-edge thermochemistry closure for the reacting (equilibrium) model.
          "Auto" (recommended) lets the solver label each edge -- frozen (unburnt)
          upstream of an Equilibrium Flame, chemical equilibrium (burnt) downstream
          (and equilibrium everywhere if the network has no flame). It tracks the
          burnt state along the actual flow, so it is robust to which way the flame
          edges happen to be drawn. "Frozen" pins the unburnt feed composition on
          this edge; "Equilibrium" solves chemical equilibrium on this edge --
          setting either on any edge switches the whole network to this manual
          per-edge closure, which does expect the flame edges drawn in the flow
          direction. Ignored by the perfect-gas model.
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        options:
          - {value: auto, label: Auto}
          - {value: frozen, label: Frozen (unburnt)}
          - {value: equilibrium, label: Equilibrium (burnt)}

nodes:
  MassFlowInlet:
    displayName: Mass Flow Inlet
    category: Boundary elements
    icon: BsArrowDownCircle
    shape: circle
    glyph: mdot
    dynamicPorts: false
    ports:
      target: []
      source: ['0']
    parameters:
      label:
        defaultValue: MassFlowInlet
      massFlowRate:
        label: Mass flow rate
        type: float
        defaultValue: 1.0
        unit: kg/s
        category: Parameters
        min: 0
        step: 0.1
        description: >-
          Mass flow delivered into the network. This is an inflow boundary, so it must be
          non-negative (0 is a closed/quiescent inlet). Suction/reverse flow is not
          modelled here -- use a Pressure Outlet (which handles ingestion/backflow) for a
          boundary that may reverse.
      totalTemperature:
        label: Total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Total temperature of the supplied stream
      composition:
        label: Composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Species mixture of the supplied stream for the reacting model, e.g.
          "O2:0.21, N2:0.79" or "CH4:1.0" (JSON is also accepted). Required by the
          equilibrium model; ignored by the perfect-gas model.
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: Whether the composition entries are mole or mass fractions.
        options:
          - {value: mole, label: Mole fractions}
          - {value: mass, label: Mass fractions}
      marker:
        label: Feed is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Whether the supplied stream is already-burnt gas rather than fresh reactant. Off
          (default) feeds fresh reactant; On feeds fully-burnt gas (e.g. exhaust-gas
          recirculation as a feed), which forces the chemical-equilibrium closure
          downstream. Only used on an all-"Auto" (marker-gated) reacting network; ignored by
          the perfect-gas model.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized mass-flow row, i.e. constant mass flow
          (mdot' = 0). Rigid is an infinite impedance (a rigid wall, u' = 0); Open
          is an ideal pressure-release end (p' = 0, reflection R = -1); Impedance
          sets the specific acoustic impedance below.
        options:
          - {value: inherit, label: 'Constant mass flow ($\dot m'' = 0$)'}
          - {value: rigid, label: Rigid ($u' = 0$)}
          - {value: open, label: Open ($p' = 0$)}
          - {value: impedance, label: Impedance}
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures (reflection coefficient,
          excitation, mean-flow open end, frequency tables) are set in Python.
        visibleIf: {parameter: boundaryType, equals: impedance}
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: {parameter: boundaryType, equals: impedance}
    disallowedConnections:
      - MassFlowInlet
      - TotalPressureInlet

  TotalPressureInlet:
    displayName: Total Pressure Inlet
    category: Boundary elements
    icon: BsArrowDownCircle
    dynamicPorts: false
    ports:
      target: []
      source: ['0']
    parameters:
      label:
        defaultValue: TotalPressureInlet
      totalPressure:
        label: Total pressure
        type: float
        defaultValue: 120000.0
        unit: Pa
        category: Parameters
        min: 1
        description: Reservoir total pressure (acts on static pressure under backflow)
      totalTemperature:
        label: Total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Reservoir total temperature
      composition:
        label: Composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Species mixture of the supplied stream for the reacting model, e.g.
          "O2:0.21, N2:0.79" or "CH4:1.0" (JSON is also accepted). Required by the
          equilibrium model; ignored by the perfect-gas model.
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: Whether the composition entries are mole or mass fractions.
        options:
          - {value: mole, label: Mole fractions}
          - {value: mass, label: Mass fractions}
      marker:
        label: Feed is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Whether the supplied stream is already-burnt gas rather than fresh reactant. Off
          (default) feeds fresh reactant; On feeds fully-burnt gas (e.g. exhaust-gas
          recirculation as a feed), which forces the chemical-equilibrium closure
          downstream. Only used on an all-"Auto" (marker-gated) reacting network; ignored by
          the perfect-gas model.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized total-pressure row, i.e. constant total
          pressure (p_t' = 0). Rigid is an infinite impedance (a rigid wall,
          u' = 0); Open is an ideal pressure-release end (p' = 0, reflection
          R = -1); Impedance sets the specific acoustic impedance below.
        options:
          - {value: inherit, label: "Constant total pressure ($p_t' = 0$)"}
          - {value: rigid, label: Rigid ($u' = 0$)}
          - {value: open, label: Open ($p' = 0$)}
          - {value: impedance, label: Impedance}
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures (reflection coefficient,
          excitation, mean-flow open end, frequency tables) are set in Python.
        visibleIf: {parameter: boundaryType, equals: impedance}
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: {parameter: boundaryType, equals: impedance}
    disallowedConnections:
      - MassFlowInlet
      - TotalPressureInlet

  PressureOutlet:
    displayName: Pressure Outlet
    category: Boundary elements
    icon: BsArrowUpCircle
    shape: circle
    glyph: p
    glyphScale: 0.85
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: PressureOutlet
      pressure:
        label: Static pressure
        type: float
        defaultValue: 101325.0
        unit: Pa
        category: Parameters
        min: 1
        description: Discharge static pressure (acts as backflow total pressure if the flow reverses)
      backflowTotalTemperature:
        label: Backflow total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Total temperature advected into the network if the flow reverses here
      composition:
        label: Backflow composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Species mixture drawn into the network on backflow (ingestion) for the
          reacting model, e.g. "O2:0.21, N2:0.79". Used only when the flow reverses
          at this outlet; ignored by the perfect-gas model.
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: Whether the backflow composition entries are mole or mass fractions.
        options:
          - {value: mole, label: Mole fractions}
          - {value: mass, label: Mass fractions}
      marker:
        label: Backflow is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Whether the backflow drawn in on ingestion is already-burnt gas rather than fresh
          reactant. Off (default) is fresh reactant; On is fully-burnt gas. Used only when
          the flow reverses at this outlet, on an all-"Auto" (marker-gated) reacting
          network; ignored by the perfect-gas model.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: open
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Rigid is an infinite impedance
          (a rigid wall, u' = 0); Open is an ideal pressure-release end (p' = 0,
          reflection R = -1); Impedance sets the specific acoustic impedance below.
        options:
          - {value: rigid, label: Rigid ($u' = 0$)}
          - {value: open, label: Open ($p' = 0$)}
          - {value: impedance, label: Impedance}
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures (reflection coefficient,
          excitation, mean-flow open end, frequency tables) are set in Python.
        visibleIf: {parameter: boundaryType, equals: impedance}
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: {parameter: boundaryType, equals: impedance}

  MassFlowOutlet:
    displayName: Mass Flow Outlet
    category: Boundary elements
    icon: BsArrowUpCircleFill
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: MassFlowOutlet
      massFlowRate:
        label: Mass flow rate
        type: float
        defaultValue: 1.0
        unit: kg/s
        category: Parameters
        step: 0.1
        description: >-
          Outflow mass rate drawn from the network (must be positive, leaving the
          domain). The outflow is pinned to this value; the static pressure floats.
          Outflow-only -- use a Mass Flow Inlet for an injecting/reversing boundary.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized mass-flow row, i.e. constant mass flow (mdot' = 0).
          Rigid is an infinite impedance (a rigid wall, u' = 0); Open is an ideal
          pressure-release end (p' = 0); Impedance sets the specific acoustic impedance.
        options:
          - {value: inherit, label: 'Constant mass flow ($\dot m'' = 0$)'}
          - {value: rigid, label: Rigid ($u' = 0$)}
          - {value: open, label: Open ($p' = 0$)}
          - {value: impedance, label: Impedance}
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures are set in Python.
        visibleIf: {parameter: boundaryType, equals: impedance}
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: {parameter: boundaryType, equals: impedance}

  ChokedNozzleOutlet:
    displayName: Choked Nozzle Outlet
    category: Boundary elements
    icon: BsFunnelFill
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: ChokedNozzleOutlet
      throatArea:
        label: Throat area
        type: float
        defaultValue: 0.01
        unit: m^2
        category: Parameters
        min: 0.000001
        description: >-
          Sonic-throat area A* of the compact (lumped) nozzle just downstream. The
          outflow is the critical mass flux for the interior stagnation state; keep
          A* smaller than the outlet area so the application plane stays subsonic.
          A choked throat is one-way -- this is an outflow-only boundary.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized critical-mass-flux row, which is the compact
          choked-nozzle (Marble-Candel) reflection with its entropy coupling. Rigid is
          an infinite impedance (u' = 0); Open is a pressure-release end (p' = 0);
          Impedance sets the specific acoustic impedance.
        options:
          - {value: inherit, label: Compact choked nozzle (Marble-Candel)}
          - {value: rigid, label: Rigid ($u' = 0$)}
          - {value: open, label: Open ($p' = 0$)}
          - {value: impedance, label: Impedance}
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures are set in Python.
        visibleIf: {parameter: boundaryType, equals: impedance}
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: {parameter: boundaryType, equals: impedance}

  Wall:
    displayName: Wall
    category: Boundary elements
    icon: BsSlashLg
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: Wall
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: rigid
        category: Acoustics
        description: >-
          Acoustic closure of the wall (mean flow is always blocked, mdot = 0).
          Rigid is an infinite acoustic impedance (a hard wall, u' = 0); Impedance
          gives the wall a liner impedance instead.
        options:
          - {value: rigid, label: Rigid ($u' = 0$)}
          - {value: impedance, label: Impedance}
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: Specific acoustic impedance magnitude |Z| / (rho c) of the liner (1 = matched).
        visibleIf: {parameter: boundaryType, equals: impedance}
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: {parameter: boundaryType, equals: impedance}

  Cavity:
    displayName: Cavity
    category: Boundary elements
    icon: BsCircle
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: Cavity
      volume:
        label: Cavity volume
        type: float
        defaultValue: 0.001
        unit: m^3
        category: Parameters
        min: 1e-9
        step: 0.0001
        description: >-
          Enclosed cavity volume V. A wall to the mean flow (mdot = 0); acoustically a
          compliance C = V/(rho c^2) that populates the storage block M. Paired with a
          neck (a short Duct, or a length-bearing element) off a junction it forms a
          Helmholtz resonator with f0 = c*sqrt(A_neck/(V*l_eff))/2pi.
    # Lumped finite-volume cavity: mean-flow-wise a wall with a volume tag, acoustically a
    # pure compliance.  Not a boundary terminal -- its reflection is the compliance itself.

  IsentropicAreaChange:
    displayName: Isentropic Area Change
    category: Two port elements
    icon: BsArrowLeftRight
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: IsentropicAreaChange
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side: stores l x A of gas
          (compliance) and adds to the effective length (inertance). Default 0 is a
          lengthless jump. Read only by the acoustic analysis; inert in the mean flow.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Added-mass length (entrained near-field, ~0.85a for a flanged mouth) added to the
          inertance only -- it lengthens L_eff and lowers a Helmholtz resonance.
    # Lossless nozzle/diffuser with emergent choking: conserves mass and total
    # pressure; the area change is given by the areas of the two attached edges.
    # The optional storage lengths give a real diffuser its acoustic compliance and
    # inertance (storage block M); leave them 0 for a lengthless jump.

  SuddenAreaChange:
    displayName: Sudden Area Change
    category: Two port elements
    icon: BsArrowsExpand
    shape: box
    glyph: sudden-area-change
    glyphInsetX: -0.02
    glyphInsetY: 0.18
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: SuddenAreaChange
      contractionCoefficient:
        label: Contraction coefficient $C_c$
        type: float
        defaultValue: 1.0
        category: Parameters
        min: 0.01
        max: 1.0
        step: 0.01
        description: >-
          Vena-contracta coefficient for the reverse (large -> small) contracting
          direction. The contraction loss is K x dynamic head referenced to the
          small (downstream) side, with K = (1/Cc - 1)^2. Cc = 1 (default) is a
          loss-free contraction; ~0.62 suits a sharp-edged contraction at a small
          area ratio (Weisbach / Idelchik). Forward (expanding) flow is unaffected.
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side (compliance +
          inertance, storage block M). A sudden change is geometrically thin -- usually
          leave this 0 and set only the End correction. Inert in the mean flow.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Added-mass length added to the inertance only -- the entrained-mass length the
          thin step still carries.
    # Borda-Carnot momentum balance for small -> large (expansion with mixing
    # loss).  Reverse (large -> small) is a vena-contracta contraction loss set by
    # contractionCoefficient (Cc = 1 -> loss-free).  Small/large sides are
    # identified from the attached edge areas.  The contraction head is the
    # incompressible 1/2 rho u^2, so the loss is accurate to O(M^2); a dedicated
    # contraction element is planned for full high-Mach fidelity.

  LossElement:
    displayName: Loss Element
    category: Two port elements
    icon: BsDiamond
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: LossElement
      lossCoefficient:
        label: Loss coefficient K
        type: float
        defaultValue: 1.0
        category: Parameters
        min: 0
        step: 0.1
        displayInfoTag: true
        infoType: popover
        description: >-
          Loss always opposes the flow, and is given by $\Delta p_t = \frac{1}{2} K \varrho u_0^2$.
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side: an orifice's
          thickness / backing length (compliance + inertance, storage block M). Default 0.
          With it the loss becomes an orifice impedance Z = R(u) + i*omega*L_eff/A.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Added-mass (end-correction) length added to the inertance only.

  LinearResistance:
    displayName: Linear Resistance
    category: Two port elements
    icon: BsGripVertical
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: LinearResistance
      resistance:
        label: Resistance R
        type: float
        defaultValue: 0.0
        unit: Pa/(kg/s)
        category: Parameters
        min: 0
        step: 0.1
        description: >-
          Linear total-pressure drop Pt_in - Pt_out = R * mdot. Unlike the quadratic Loss
          Element it stays active at zero mean flow -- the acoustic resistance of a screen,
          perforate or damper. With the storage lengths below it becomes an orifice
          impedance Z = R + i*omega*L_eff/A.
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side (compliance +
          inertance, storage block M). Inert in the mean flow.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Added-mass (end-correction) length added to the inertance only -- the reactance
          of a screen/perforate's effective neck.
    # Linear flow resistance Pt_in - Pt_out = R * mdot: survives the linearization at zero
    # mean flow (the velocity-squared Loss does not), so it is the quiescent acoustic
    # resistance.  With storage lengths it carries both resistance and reactance.

  Duct:
    displayName: Duct
    category: Two port elements
    icon: BsArrowBarRight
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: Duct
      length:
        label: Length
        type: float
        defaultValue: 1.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.01
        description: >-
          Duct length.  Lossless constant-area passage for the mean flow; the
          length is read by the acoustic analysis for wave propagation.

  Pipe:
    displayName: Pipe
    category: Two port elements
    icon: BsBezier2
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: Pipe
      length:
        label: Length
        type: float
        defaultValue: 1.0
        unit: m
        category: Parameters
        min: 0.000001
        step: 0.01
        description: >-
          Pipe length L. Sets both the Darcy-Weisbach friction (K = f L / D on the mean
          flow) and the acoustic propagation length (waves propagate like a duct).
      diameter:
        label: Hydraulic diameter
        type: float
        defaultValue: 0.05
        unit: m
        category: Parameters
        min: 0.000001
        step: 0.001
        description: >-
          Hydraulic diameter D used in the friction term K = f L / D. For a circular pipe
          the flow area on the edges is pi D^2 / 4; a non-circular passage passes its
          hydraulic diameter and matching edge area.
      frictionFactor:
        label: Darcy friction factor
        type: float
        defaultValue: 0.02
        category: Parameters
        min: 0
        step: 0.001
        description: >-
          Darcy friction factor f (e.g. 64/Re laminar, Haaland/Colebrook turbulent). Drops
          total pressure by K = f L / D dynamic heads, with the drop reversing with the flow.
    # Length-bearing pipe: Darcy-Weisbach wall friction on the mean flow plus the duct
    # acoustic phase (DUCT + LOSS unification, Greyvenstein-Laurie). Constant area -- both
    # edges must share one flow area. Exact in the low-Mach limit; for a long/fast pipe that
    # develops Fanno gradients toward choke, chain several (a distributed pipe, set in Python).

  HeatReleaseFlame:
    displayName: Heat Release Flame
    category: Two port elements
    icon: BsBrightnessHighFill
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: HeatReleaseFlame
      heatRelease:
        label: Heat release rate
        type: float
        defaultValue: 1000000.0
        unit: W
        category: Parameters
        step: 1000
        description: >-
          Steady heat power added across the compact flame ($>0$ heats the flow).
          Perfect-gas flame: conserves mass and total pressure and raises the total
          temperature by $\dot Q / (\dot m\, c_p)$. For the perfect-gas model -- use
          an Equilibrium Flame for the reacting model.
    # Compact constant-area heat-addition flame (perfect gas). Both edges must
    # share one area. The mean flame is acoustically passive; an unsteady
    # (FTF / n-tau) heat-release source is attached in Python.

  EquilibriumFlame:
    displayName: Equilibrium Flame
    category: Two port elements
    icon: BsFire
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: EquilibriumFlame
    # Compact reacting flame: frozen (unburnt) inflow -> chemical-equilibrium
    # products (conserves mass, static pressure, total enthalpy and the elemental
    # composition). For the equilibrium thermo model. Both edges must share one
    # area. The inflow side is the "frozen" closure and the outflow side
    # "equilibrium" -- the default "Auto" edge closure sets this automatically from
    # the flow direction, so the flame edges may be drawn either way round.
    # No numeric parameters: the temperature rise emerges from the equilibrium
    # solve at the shared (composition, enthalpy, pressure).

  MassSource:
    displayName: Mass Source
    category: Two port elements
    icon: BsDropletFill
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: MassSource
      massFlowRate:
        label: Injected mass flow
        type: float
        defaultValue: 0.1
        unit: kg/s
        category: Parameters
        min: 0
        step: 0.01
        description: Mass flow injected into the through-flow (> 0 adds mass).
      injectionTemperature:
        label: Injection total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Total temperature of the injected stream (sets its enthalpy datum).
      injectionVelocity:
        label: Injection axial velocity
        type: float
        defaultValue: 0.0
        unit: m/s
        category: Parameters
        description: >-
          Axial velocity of the injected stream for the momentum source. 0 (default)
          is normal/transverse injection -- adds mass with no axial momentum.
      composition:
        label: Composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Species mixture of the injected stream for the reacting model, e.g.
          "CH4:1.0" for a fuel injector. Required by the equilibrium model; ignored
          by the perfect-gas model.
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: Whether the composition entries are mole or mass fractions.
        options:
          - {value: mole, label: Mole fractions}
          - {value: mass, label: Mass fractions}
      marker:
        label: Injectant is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: {parameter: thermoModel, scope: model, equals: equilibrium}
        description: >-
          Whether the injected stream is already-burnt gas rather than fresh reactant. Off
          (default) injects fresh reactant (the normal case for an injector); On injects
          fully-burnt gas. Only used on an all-"Auto" (marker-gated) reacting network;
          ignored by the perfect-gas model.
    # Inline mass-injection element (a fuel injector when reacting). Conserves
    # mass / momentum / energy with the injection source terms; performs no
    # reaction itself -- ignition is the flame's job. Constant-area (both edges
    # must share one area).

  JunctionStaticP:
    displayName: Junction (static p)
    category: Multi port elements
    icon: BsLightningFill
    dynamicPorts: true
    dynamicPortConfig:
      target:
        countParameter: leftPorts
        default: 2
        min: 1
      source:
        countParameter: rightPorts
        default: 1
        min: 1
    ports:
      target: []
      source: []
    parameters:
      label:
        defaultValue: Junction
      leftPorts:
        label: Left ports
        type: number
        defaultValue: 2
        min: 1
        step: 1
        category: Ports
        description: Number of left (target) ports
      rightPorts:
        label: Right ports
        type: number
        defaultValue: 1
        min: 1
        step: 1
        category: Ports
        description: Number of right (source) ports
      volume:
        label: Chamber volume
        type: float
        defaultValue: 0.0
        unit: m^3
        category: Acoustics
        min: 0
        step: 0.0001
        description: >-
          Plenum/chamber volume. Gives the manifold the acoustic compliance
          C = V/(rho c^2) on its common pressure (storage block M) -- a junction with a
          volume is a cavity with through-flow. Default 0 = no compliance. Inert in the mean flow.
    # Common static pressure on all ports; inflow enthalpies mix mass-weighted.
    # A branch neck inertance is modeled as an explicit neck Duct off the manifold (as in a
    # Helmholtz resonator), not a manifold parameter.
    # Only valid where all port Mach numbers are low -- use LosslessSplitter for
    # plenums feeding fast branches.

  LosslessSplitter:
    displayName: Lossless Splitter
    category: Multi port elements
    icon: BsDiagram2
    dynamicPorts: true
    dynamicPortConfig:
      source:
        countParameter: rightPorts
        default: 2
        min: 1
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: Splitter
      rightPorts:
        label: Output ports
        type: number
        defaultValue: 2
        min: 1
        step: 1
        category: Ports
        description: Number of output ports
      volume:
        label: Chamber volume
        type: float
        defaultValue: 0.0
        unit: m^3
        category: Acoustics
        min: 0
        step: 0.0001
        description: >-
          Plenum/chamber volume. Gives the splitter the acoustic compliance
          C = V/(rho c^2) on its common pressure (storage block M). Default 0 = no
          compliance. Inert in the mean flow.
    # Common total pressure on all ports (isentropic distribution plenum):
    # mass + energy + constant entropy into every branch.
