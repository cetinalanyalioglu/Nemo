      fractions:
        label: Outflow fractions
        type: string
        defaultValue: '0.5'
        category: Parameters
        required: true
        description: >-
          Controlled outflow mass fractions, comma separated, one value per output port
          except the last -- e.g. "0.3, 0.2" for three outputs. Each value is that
          port's share of the inflow (in port order, all in (0, 1), sum < 1); the last
          output carries the remainder and keeps total-pressure continuity with the
          inflow.
    # Ideal flow divider: the branch flows are prescribed (mdot_k = beta_k * mdot_in)
    # rather than set by downstream resistance, so the controlled branch pressures
    # float -- downstream elements must absorb the jump (a control-valve
    # idealization). Reverse flow through the splitter is not modelled.
