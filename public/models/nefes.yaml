# Nefes Flow Network model definition
#
# Element library for the Nefes compressible flow-network solver
# (~/Projects/Nefes).  Networks built with this model and saved from the UI are
# read directly by the solver:
#
#     from nefes.io import load_case
#     solution = load_case("<saved-case>.yaml").solve()
#
# The model id must match the solver's loader (nefes.io.yaml_in.MODEL_ID).
#
# Conventions matching the solver:
#   - All solution variables live on EDGES; each edge needs its flow area.
#   - Edge direction (source -> target) is only a sign convention: a negative
#     mass flow in the results means the gas runs against the drawn arrow.
#   - Every element contributes exactly one equation per port.  PORTS ARE
#     SIGNIFICANT: for a two-port element the target side is port 0 and the
#     source side is port 1 (the LossElement references its dynamic head to the
#     port-0 area; junction/splitter use port 0 as the common-pressure
#     reference).  The solver reads the port ordinals from each edge's
#     source/target handles, so keep handles attached to the intended ports.
#   - JunctionStaticP is valid only where all ports run at low Mach number; use
#     LosslessSplitter for plenums/manifolds feeding fast branches.
#   - MixingJunction (Mixer) is the general merge: it obeys the second law at any port
#     Mach number.  At its default recovery = 1 each inflow must be pinned by the network
#     (a prescribed rate or a branch resistance); lower recovery toward 0 for bare feeds.
#
# Scope: v1 is subsonic (flowing or quiescent).  Supersonic inlets/outlets are
# deferred and intentionally omitted from this library.  The Duct element is
# length-bearing: its mean-flow face is a lossless constant-area passage, and
# its length feeds the acoustic (perturbation) analysis.
#
# Composite elements (Orifice, Lossy Nozzle, Sudden Contraction, Helmholtz
# Resonator, Fanno Pipe, Tapered Duct) are single nodes here that the solver
# expands at build time into their atomic recipes (nefes.elements.catalog);
# their internal states are read back via solution.composite(<label>).
#
# Model-level parameters (Model pane) hold the thermo model, the gas properties
# and the reference scales used by the solver for nondimensionalization.  The
# "Thermo model" selector switches between a calorically-perfect gas (R, gamma)
# and the reacting equilibrium model.  The species thermochemistry comes from the
# built-in NASA Glenn / CEA database (no file to supply).  For the reacting model:
#   - give every inlet / mass source an explicit Composition (e.g.
#     "O2:0.21, N2:0.79" or "CH4:1.0") on a mole or mass basis;
#   - leave Stream mode on "Auto" to make each distinct feed composition a transported
#     stream, or set it to "Declared" and list the named streams in "Declared streams"
#     (each feed's Composition is then a blend over them, e.g. "air:20, H2:1"), so a
#     single premixed inlet can carry a live mixture fraction without a dedicated fuel inlet;
#   - leave Species on "auto" to derive the product slate from those feeds, or list
#     the species explicitly;
#   - drop an Equilibrium Flame where the mixture ignites -- edges default to the
#     "Auto" closure (frozen upstream of a flame, equilibrium downstream); set an
#     edge's closure explicitly to override.
# Composition / basis fields and the edge closure apply only to the equilibrium
# model; they are hidden (via a model-scoped visibleIf on "Thermo model") and
# ignored when the perfect-gas model is selected.

id: nefes
name: Nefes Flow Network
description: Compressible flow-network element library for the Nefes solver (mean flow + acoustics).
forceUniqueNodeLabels: true

parameters:
  thermoModel:
    label: Thermo model
    type: select
    defaultValue: perfect_gas
    category: Gas
    description: >-
      Thermodynamic model for the whole network. "Perfect gas" is a single
      calorically-perfect gas (constant R and gamma). "Equilibrium (reacting)"
      transports the feed-stream mixture fractions and slaves the species to
      chemical (HP) equilibrium; it uses the built-in thermochemistry database and
      needs an explicit composition on every inlet / mass source.
    options:
      - { value: perfect_gas, label: Perfect gas }
      - { value: equilibrium, label: Equilibrium (reacting) }
  gasConstant:
    label: Specific gas constant R
    type: float
    defaultValue: 287.0
    unit: J/(kg K)
    category: Gas
    min: 1
    description: Specific gas constant of the working gas
    visibleIf: { parameter: thermoModel, equals: perfect_gas }
  heatCapacityRatio:
    label: Heat capacity ratio
    type: float
    defaultValue: 1.4
    category: Gas
    min: 1.001
    max: 1.999
    step: 0.01
    description: cp/cv of the working gas (calorically perfect)
    visibleIf: { parameter: thermoModel, equals: perfect_gas }
  species:
    label: Species
    type: string
    defaultValue: auto
    category: Gas
    description: >-
      Species to model, from the built-in NASA Glenn / CEA database. Leave "auto"
      (the default) to derive the product slate automatically from the feed
      compositions -- every species reachable from the fed-in elements, trimmed to
      those that are non-trace at equilibrium. Or give an explicit comma-separated
      list, e.g. "CH4, O2, N2, CO2, H2O, OH, H, O". Condensed feeds (e.g. a liquid
      fuel like "Jet-A(L)") are allowed in the composition and contribute their
      enthalpy; equilibrium products are gas-phase.
    visibleIf: { parameter: thermoModel, equals: equilibrium }
  streamMode:
    label: Stream mode
    type: select
    defaultValue: auto
    category: Gas
    description: >-
      How the reacting model's transported feed streams are set. "Auto" discovers
      them from the distinct inlet / mass-source compositions (each feed names a
      species mixture). "Declared" fixes a named set of streams up front (below);
      each feed then states its composition as a blend over those streams, so a
      single premixed inlet can carry a live mixture fraction (equivalence ratio)
      without a dedicated fuel inlet.
    options:
      - { value: auto, label: Auto (from feeds) }
      - { value: declared, label: Declared }
    visibleIf: { parameter: thermoModel, equals: equilibrium }
  streams:
    label: Declared streams
    type: string
    defaultValue: ""
    category: Gas
    description: >-
      The named feed streams, written as "label = species:frac, ...; label = ..."
      (streams separated by ";", each a label and a species mixture). Example:
      "air = O2:0.21, N2:0.79; H2 = H2:1". Each feed's composition is then a blend
      over these labels (e.g. "air:20, H2:1"). Used only in "Declared" stream mode.
    visibleIf: { parameter: streamMode, equals: declared }
  streamBasis:
    label: Declared stream basis
    type: select
    defaultValue: mole
    category: Gas
    options:
      - { value: mole, label: Mole fractions }
      - { value: mass, label: Mass fractions }
    description: Whether the declared stream compositions above are mole or mass fractions.
    visibleIf: { parameter: streamMode, equals: declared }
  referencePressure:
    label: Reference pressure
    type: float
    defaultValue: 101325.0
    unit: Pa
    category: References
    min: 1
    description: Pressure scale used for nondimensionalization and initialization
  referenceTemperature:
    label: Reference temperature
    type: float
    defaultValue: 300.0
    unit: K
    category: References
    min: 1
    description: Temperature scale used for nondimensionalization and initialization
  referenceMassFlow:
    label: Reference mass flow
    type: float
    defaultValue: 0.0
    unit: kg/s
    category: References
    min: 0
    description: >-
      Mass-flow scale for nondimensionalization. Leave 0 to derive it
      automatically (largest specified mass flow, else a Mach-0.3 estimate on
      the median edge area).

edges:
  flow:
    displayName: Flow Edge
    category: Flow Connections
    parameters:
      area:
        label: Area
        type: float
        unit: m^2
        category: Parameters
        min: 0.000001
        required: true
        description: Cross-sectional flow area at this port surface (must be supplied)
        editable: true
        visible: true
      thermoModel:
        label: Closure (reacting)
        type: select
        defaultValue: auto
        category: Reacting
        description: >-
          Per-edge thermochemistry closure for the reacting (equilibrium) model.
          "Auto" (recommended) lets the solver label each edge -- frozen (unburnt)
          upstream of an Equilibrium Flame, chemical equilibrium (burnt) downstream
          (and equilibrium everywhere if the network has no flame). It tracks the
          burnt state along the actual flow, so it is robust to which way the flame
          edges happen to be drawn. "Frozen" pins the unburnt feed composition on
          this edge; "Equilibrium" solves chemical equilibrium on this edge --
          setting either on any edge switches the whole network to this manual
          per-edge closure, which does expect the flame edges drawn in the flow
          direction. Ignored by the perfect-gas model.
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        options:
          - { value: auto, label: Auto }
          - { value: frozen, label: Frozen (unburnt) }
          - { value: equilibrium, label: Equilibrium (burnt) }

nodes:
  MassFlowInlet:
    displayName: Mass Flow Inlet
    category: Boundary elements
    icon: BsArrowDownCircle
    shape: circle
    glyph: mdot
    dynamicPorts: false
    ports:
      target: []
      source: ['0']
    parameters:
      label:
        defaultValue: MassFlowInlet
      massFlowRate:
        label: Mass flow rate
        type: float
        defaultValue: 1.0
        unit: kg/s
        category: Parameters
        min: 0
        step: 0.1
        description: >-
          Mass flow delivered into the network. This is an inflow boundary, so it must be
          non-negative (0 is a closed/quiescent inlet). Suction/reverse flow is not
          modelled here -- use a Pressure Outlet (which handles ingestion/backflow) for a
          boundary that may reverse.
      totalTemperature:
        label: Total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Total temperature of the supplied stream
      composition:
        label: Composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Species mixture of the supplied stream for the reacting model, e.g.
          "O2:0.21, N2:0.79" or "CH4:1.0" (JSON is also accepted). Required by the
          equilibrium model; ignored by the perfect-gas model. In "Declared" stream
          mode the entries are a blend over the declared streams instead, e.g.
          "air:20, H2:1".
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: Whether the composition entries are mole or mass fractions.
        options:
          - { value: mole, label: Mole fractions }
          - { value: mass, label: Mass fractions }
      marker:
        label: Feed is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Whether the supplied stream is already-burnt gas rather than fresh reactant. Off
          (default) feeds fresh reactant; On feeds fully-burnt gas (e.g. exhaust-gas
          recirculation as a feed), which forces the chemical-equilibrium closure
          downstream. Only used on an all-"Auto" (marker-gated) reacting network; ignored by
          the perfect-gas model.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized mass-flow row, i.e. constant mass flow
          (mdot' = 0). Rigid is an infinite impedance (a rigid wall, u' = 0); Open
          is an ideal pressure-release end (p' = 0, reflection R = -1); Impedance
          sets the specific acoustic impedance below.
        options:
          - { value: inherit, label: 'Constant mass flow ($\dot m'' = 0$)' }
          - { value: rigid, label: Rigid ($u' = 0$) }
          - { value: open, label: Open ($p' = 0$) }
          - { value: impedance, label: Impedance }
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures (reflection coefficient,
          excitation, mean-flow open end, frequency tables) are set in Python.
        visibleIf: { parameter: boundaryType, equals: impedance }
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: { parameter: boundaryType, equals: impedance }
    disallowedConnections:
      - MassFlowInlet
      - TotalPressureInlet

  TotalPressureInlet:
    displayName: Total Pressure Inlet
    category: Boundary elements
    icon: BsArrowDownCircle
    shape: circle
    glyph: pt
    dynamicPorts: false
    ports:
      target: []
      source: ['0']
    parameters:
      label:
        defaultValue: TotalPressureInlet
      totalPressure:
        label: Total pressure
        type: float
        defaultValue: 120000.0
        unit: Pa
        category: Parameters
        min: 1
        description: Reservoir total pressure (acts on static pressure under backflow)
      totalTemperature:
        label: Total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Reservoir total temperature
      composition:
        label: Composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Species mixture of the supplied stream for the reacting model, e.g.
          "O2:0.21, N2:0.79" or "CH4:1.0" (JSON is also accepted). Required by the
          equilibrium model; ignored by the perfect-gas model. In "Declared" stream
          mode the entries are a blend over the declared streams instead, e.g.
          "air:20, H2:1".
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: Whether the composition entries are mole or mass fractions.
        options:
          - { value: mole, label: Mole fractions }
          - { value: mass, label: Mass fractions }
      marker:
        label: Feed is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Whether the supplied stream is already-burnt gas rather than fresh reactant. Off
          (default) feeds fresh reactant; On feeds fully-burnt gas (e.g. exhaust-gas
          recirculation as a feed), which forces the chemical-equilibrium closure
          downstream. Only used on an all-"Auto" (marker-gated) reacting network; ignored by
          the perfect-gas model.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized total-pressure row, i.e. constant total
          pressure (p_t' = 0). Rigid is an infinite impedance (a rigid wall,
          u' = 0); Open is an ideal pressure-release end (p' = 0, reflection
          R = -1); Impedance sets the specific acoustic impedance below.
        options:
          - { value: inherit, label: "Constant total pressure ($p_t' = 0$)" }
          - { value: rigid, label: Rigid ($u' = 0$) }
          - { value: open, label: Open ($p' = 0$) }
          - { value: impedance, label: Impedance }
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures (reflection coefficient,
          excitation, mean-flow open end, frequency tables) are set in Python.
        visibleIf: { parameter: boundaryType, equals: impedance }
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: { parameter: boundaryType, equals: impedance }
    disallowedConnections:
      - MassFlowInlet
      - TotalPressureInlet

  PressureOutlet:
    displayName: Pressure Outlet
    category: Boundary elements
    icon: BsArrowUpCircle
    shape: circle
    glyph: p
    glyphScale: 0.85
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: PressureOutlet
      pressure:
        label: Static pressure
        type: float
        defaultValue: 101325.0
        unit: Pa
        category: Parameters
        min: 1
        description: Discharge static pressure (acts as backflow total pressure if the flow reverses)
      backflowTotalTemperature:
        label: Backflow total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Total temperature advected into the network if the flow reverses here
      composition:
        label: Backflow composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Species mixture drawn into the network on backflow (ingestion) for the
          reacting model, e.g. "O2:0.21, N2:0.79". Used only when the flow reverses
          at this outlet; ignored by the perfect-gas model. In "Declared" stream
          mode the entries are a blend over the declared streams instead.
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: Whether the backflow composition entries are mole or mass fractions.
        options:
          - { value: mole, label: Mole fractions }
          - { value: mass, label: Mass fractions }
      marker:
        label: Backflow is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Whether the backflow drawn in on ingestion is already-burnt gas rather than fresh
          reactant. Off (default) is fresh reactant; On is fully-burnt gas. Used only when
          the flow reverses at this outlet, on an all-"Auto" (marker-gated) reacting
          network; ignored by the perfect-gas model.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: open
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Rigid is an infinite impedance
          (a rigid wall, u' = 0); Open is an ideal pressure-release end (p' = 0,
          reflection R = -1); Impedance sets the specific acoustic impedance below.
        options:
          - { value: rigid, label: Rigid ($u' = 0$) }
          - { value: open, label: Open ($p' = 0$) }
          - { value: impedance, label: Impedance }
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures (reflection coefficient,
          excitation, mean-flow open end, frequency tables) are set in Python.
        visibleIf: { parameter: boundaryType, equals: impedance }
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: { parameter: boundaryType, equals: impedance }

  MassFlowOutlet:
    displayName: Mass Flow Outlet
    category: Boundary elements
    icon: BsArrowUpCircleFill
    shape: circle
    glyph: mdot
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: MassFlowOutlet
      massFlowRate:
        label: Mass flow rate
        type: float
        defaultValue: 1.0
        unit: kg/s
        category: Parameters
        step: 0.1
        description: >-
          Outflow mass rate drawn from the network (must be positive, leaving the
          domain). The outflow is pinned to this value; the static pressure floats.
          Outflow-only -- use a Mass Flow Inlet for an injecting/reversing boundary.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized mass-flow row, i.e. constant mass flow (mdot' = 0).
          Rigid is an infinite impedance (a rigid wall, u' = 0); Open is an ideal
          pressure-release end (p' = 0); Impedance sets the specific acoustic impedance.
        options:
          - { value: inherit, label: 'Constant mass flow ($\dot m'' = 0$)' }
          - { value: rigid, label: Rigid ($u' = 0$) }
          - { value: open, label: Open ($p' = 0$) }
          - { value: impedance, label: Impedance }
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures are set in Python.
        visibleIf: { parameter: boundaryType, equals: impedance }
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: { parameter: boundaryType, equals: impedance }

  ChokedNozzleOutlet:
    displayName: Choked Nozzle Outlet
    category: Boundary elements
    icon: BsFunnelFill
    shape: box
    glyph: choked-nozzle
    glyphInsetX: 0.0
    glyphInsetY: 0.12
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: ChokedNozzleOutlet
      throatArea:
        label: Throat area
        type: float
        defaultValue: 0.01
        unit: m^2
        category: Parameters
        min: 0.000001
        description: >-
          Sonic-throat area A* of the compact (lumped) nozzle just downstream. The
          outflow is the critical mass flux for the interior stagnation state; keep
          A* smaller than the outlet area so the application plane stays subsonic.
          A choked throat is one-way -- this is an outflow-only boundary.
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: inherit
        category: Acoustics
        description: >-
          Acoustic termination at this terminal. Inherit is the element's natural
          closure -- the linearized critical-mass-flux row, which is the compact
          choked-nozzle (Marble-Candel) reflection with its entropy coupling. Rigid is
          an infinite impedance (u' = 0); Open is a pressure-release end (p' = 0);
          Impedance sets the specific acoustic impedance.
        options:
          - { value: inherit, label: Compact choked nozzle (Marble-Candel) }
          - { value: rigid, label: Rigid ($u' = 0$) }
          - { value: open, label: Open ($p' = 0$) }
          - { value: impedance, label: Impedance }
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: >-
          Specific acoustic impedance magnitude |Z| / (rho c) at this terminal
          (1 = matched / non-reflecting). Advanced closures are set in Python.
        visibleIf: { parameter: boundaryType, equals: impedance }
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: { parameter: boundaryType, equals: impedance }

  Wall:
    displayName: Wall
    category: Boundary elements
    icon: BsSlashLg
    shape: circle
    glyph: wall
    glyphScale: 1.77
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: Wall
      boundaryType:
        label: Acoustic boundary
        type: select
        defaultValue: rigid
        category: Acoustics
        description: >-
          Acoustic closure of the wall (mean flow is always blocked, mdot = 0).
          Rigid is an infinite acoustic impedance (a hard wall, u' = 0); Impedance
          gives the wall a liner impedance instead.
        options:
          - { value: rigid, label: Rigid ($u' = 0$) }
          - { value: impedance, label: Impedance }
      impedanceMagnitude:
        label: Impedance amplitude
        type: float
        defaultValue: 1.0
        category: Acoustics
        min: 0
        description: Specific acoustic impedance magnitude |Z| / (rho c) of the liner (1 = matched).
        visibleIf: { parameter: boundaryType, equals: impedance }
      impedancePhase:
        label: Impedance phase (deg)
        type: float
        defaultValue: 0.0
        unit: deg
        category: Acoustics
        description: Phase of the specific acoustic impedance, in degrees.
        visibleIf: { parameter: boundaryType, equals: impedance }

  Cavity:
    displayName: Cavity
    category: Boundary elements
    icon: BsCircle
    shape: circle
    glyph: cavity
    dynamicPorts: false
    ports:
      target: ['0']
      source: []
    parameters:
      label:
        defaultValue: Cavity
      volume:
        label: Cavity volume
        type: float
        defaultValue: 0.001
        unit: m^3
        category: Parameters
        min: 1e-9
        step: 0.0001
        description: >-
          Enclosed cavity volume V. A wall to the mean flow (mdot = 0); acoustically a
          compliance C = V/(rho c^2) that populates the storage block M. Paired with a
          neck (a short Duct, or a length-bearing element) off a junction it forms a
          Helmholtz resonator with f0 = c*sqrt(A_neck/(V*l_eff))/2pi.
    # Lumped finite-volume cavity: mean-flow-wise a wall with a volume tag, acoustically a
    # pure compliance.  Not a boundary terminal -- its reflection is the compliance itself.

  IsentropicAreaChange:
    displayName: Isentropic Area Change
    category: Two port elements
    icon: BsArrowLeftRight
    shape: box
    glyph: isentropic-area-change
    glyphInsetX: -0.02
    glyphInsetY: 0.15
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: IsentropicAreaChange
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side: stores l x A of gas
          (compliance) and adds to the effective length (inertance). Default 0 is a
          lengthless jump. Read only by the acoustic analysis; inert in the mean flow.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Added-mass length (entrained near-field, ~0.85a for a flanged mouth) added to the
          inertance only -- it lengthens L_eff and lowers a Helmholtz resonance.
    # Lossless nozzle/diffuser with emergent choking: conserves mass and total
    # pressure; the area change is given by the areas of the two attached edges.
    # The optional storage lengths give a real diffuser its acoustic compliance and
    # inertance (storage block M); leave them 0 for a lengthless jump.

  TransferMatrix:
    displayName: Transfer Matrix
    category: Two port elements
    icon: BsGrid3X3
    shape: box
    glyph: transfer-matrix
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: TransferMatrix
    # 2-port whose acoustic response is a user-supplied transfer matrix
    # w_down = TM(omega) . w_up; mean-flow-wise an isentropic area change, so it
    # seats a well-defined mean state on both faces. The frequency-domain
    # descriptor is a Python object with no YAML form and cannot be entered
    # here: load the case in Python and attach it (spec.transfer_matrix = ...).

  SuddenAreaChange:
    displayName: Sudden Area Change
    category: Two port elements
    icon: BsArrowsExpand
    shape: box
    glyph: sudden-area-change
    glyphInsetX: -0.02
    glyphInsetY: 0.18
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: SuddenAreaChange
      contractionCoefficient:
        label: Contraction coefficient $C_c$
        type: float
        defaultValue: 1.0
        category: Parameters
        min: 0.01
        max: 1.0
        step: 0.01
        description: >-
          Vena-contracta coefficient for the reverse (large -> small) contracting
          direction. The contraction loss is K x dynamic head referenced to the
          small (downstream) side, with K = (1/Cc - 1)^2. Cc = 1 (default) is a
          loss-free contraction; ~0.62 suits a sharp-edged contraction at a small
          area ratio (Weisbach / Idelchik). Forward (expanding) flow is unaffected.
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side (compliance +
          inertance, storage block M). A sudden change is geometrically thin -- usually
          leave this 0 and set only the End correction. Inert in the mean flow.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Added-mass length added to the inertance only -- the entrained-mass length the
          thin step still carries.
    # Borda-Carnot momentum balance for small -> large (expansion with mixing
    # loss).  Reverse (large -> small) is a vena-contracta contraction loss set by
    # contractionCoefficient (Cc = 1 -> loss-free).  Small/large sides are
    # identified from the attached edge areas.  The contraction head is the
    # incompressible 1/2 rho u^2, so the loss is accurate to O(M^2); a dedicated
    # contraction element is planned for full high-Mach fidelity.

  LossElement:
    displayName: Loss Element
    category: Two port elements
    icon: BsDiamond
    shape: box
    glyph: loss-element
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: LossElement
      lossCoefficient:
        label: Loss coefficient K
        type: float
        defaultValue: 1.0
        category: Parameters
        min: 0
        step: 0.1
        displayInfoTag: true
        infoType: popover
        description: >-
          Loss always opposes the flow, and is given by $\Delta p_t = \frac{1}{2} K \varrho u_0^2$.
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side: an orifice's
          thickness / backing length (compliance + inertance, storage block M). Default 0.
          With it the loss becomes an orifice impedance Z = R(u) + i*omega*L_eff/A.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Added-mass (end-correction) length added to the inertance only.

  LinearResistance:
    displayName: Linear Resistance
    category: Two port elements
    icon: BsGripVertical
    shape: box
    glyph: linear-resistance
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: LinearResistance
      resistance:
        label: Resistance R
        type: float
        defaultValue: 0.0
        unit: Pa/(kg/s)
        category: Parameters
        min: 0
        step: 0.1
        description: >-
          Linear total-pressure drop Pt_in - Pt_out = R * mdot. Unlike the quadratic Loss
          Element it stays active at zero mean flow -- the acoustic resistance of a screen,
          perforate or damper. With the storage lengths below it becomes an orifice
          impedance Z = R + i*omega*L_eff/A.
      lengthUpstream:
        label: Upstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Acoustic storage half-length on the upstream (port-0) side (compliance +
          inertance, storage block M). Inert in the mean flow.
      lengthDownstream:
        label: Downstream storage length
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: Acoustic storage half-length on the downstream (port-1) side.
      endCorrection:
        label: End correction
        type: float
        defaultValue: 0.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.001
        description: >-
          Added-mass (end-correction) length added to the inertance only -- the reactance
          of a screen/perforate's effective neck.
    # Linear flow resistance Pt_in - Pt_out = R * mdot: survives the linearization at zero
    # mean flow (the velocity-squared Loss does not), so it is the quiescent acoustic
    # resistance.  With storage lengths it carries both resistance and reactance.

  Duct:
    displayName: Duct
    category: Two port elements
    icon: BsArrowBarRight
    shape: box
    glyph: duct
    glyphInsetX: -0.02
    glyphInsetY: -0.02
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: Duct
      length:
        label: Length
        type: float
        defaultValue: 1.0
        unit: m
        category: Acoustics
        min: 0
        step: 0.01
        description: >-
          Duct length.  Lossless constant-area passage for the mean flow; the
          length is read by the acoustic analysis for wave propagation.

  Pipe:
    displayName: Pipe
    category: Two port elements
    icon: BsBezier2
    shape: box
    glyph: pipe
    glyphInsetX: -0.02
    glyphInsetY: -0.02
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: Pipe
      length:
        label: Length
        type: float
        defaultValue: 1.0
        unit: m
        category: Parameters
        min: 0.000001
        step: 0.01
        description: >-
          Pipe length L. Sets both the Darcy-Weisbach friction (K = f L / D on the mean
          flow) and the acoustic propagation length (waves propagate like a duct).
      diameter:
        label: Hydraulic diameter
        type: float
        defaultValue: 0.05
        unit: m
        category: Parameters
        min: 0.000001
        step: 0.001
        description: >-
          Hydraulic diameter D used in the friction term K = f L / D. For a circular pipe
          the flow area on the edges is pi D^2 / 4; a non-circular passage passes its
          hydraulic diameter and matching edge area.
      frictionFactor:
        label: Darcy friction factor
        type: float
        defaultValue: 0.02
        category: Parameters
        min: 0
        step: 0.001
        description: >-
          Darcy friction factor f (e.g. 64/Re laminar, Haaland/Colebrook turbulent). Drops
          total pressure by K = f L / D dynamic heads, with the drop reversing with the flow.
    # Length-bearing pipe: Darcy-Weisbach wall friction on the mean flow plus the duct
    # acoustic phase (DUCT + LOSS unification, Greyvenstein-Laurie). Constant area -- both
    # edges must share one flow area. Exact in the low-Mach limit; for a long/fast pipe that
    # develops Fanno gradients toward choke, chain several (a distributed pipe, set in Python).

  HeatReleaseFlame:
    displayName: Heat Release Flame
    category: Two port elements
    icon: BsBrightnessHighFill
    shape: box
    glyph: heat-release-flame
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: HeatReleaseFlame
      heatRelease:
        label: Heat release rate
        type: float
        defaultValue: 1000000.0
        unit: W
        category: Parameters
        step: 1000
        description: >-
          Steady heat power added across the compact flame ($>0$ heats the flow).
          Perfect-gas flame: conserves mass and total pressure and raises the total
          temperature by $\dot Q / (\dot m\, c_p)$. For the perfect-gas model -- use
          an Equilibrium Flame for the reacting model.
    # Compact constant-area heat-addition flame (perfect gas). Both edges must
    # share one area. The mean flame is acoustically passive; an unsteady
    # (FTF / n-tau) heat-release source is attached in Python.

  EquilibriumFlame:
    displayName: Equilibrium Flame
    category: Two port elements
    icon: BsFire
    shape: box
    glyph: equilibrium-flame
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: EquilibriumFlame
    # Compact reacting flame: frozen (unburnt) inflow -> chemical-equilibrium
    # products (conserves mass, static pressure, total enthalpy and the elemental
    # composition). For the equilibrium thermo model. Both edges must share one
    # area. The inflow side is the "frozen" closure and the outflow side
    # "equilibrium" -- the default "Auto" edge closure sets this automatically from
    # the flow direction, so the flame edges may be drawn either way round.
    # No numeric parameters: the temperature rise emerges from the equilibrium
    # solve at the shared (composition, enthalpy, pressure).

  MassSource:
    displayName: Mass Source
    category: Two port elements
    icon: BsDropletFill
    shape: box
    glyph: mass-source
    glyphInsetX: -0.02
    glyphInsetY: 0.02
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: MassSource
      massFlowRate:
        label: Injected mass flow
        type: float
        defaultValue: 0.1
        unit: kg/s
        category: Parameters
        min: 0
        step: 0.01
        description: Mass flow injected into the through-flow (> 0 adds mass).
      injectionTemperature:
        label: Injection total temperature
        type: float
        defaultValue: 300.0
        unit: K
        category: Parameters
        min: 1
        description: Total temperature of the injected stream (sets its enthalpy datum).
      injectionVelocity:
        label: Injection axial velocity
        type: float
        defaultValue: 0.0
        unit: m/s
        category: Parameters
        description: >-
          Axial velocity of the injected stream for the momentum source. 0 (default)
          is normal/transverse injection -- adds mass with no axial momentum.
      composition:
        label: Composition
        type: string
        defaultValue: ''
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Species mixture of the injected stream for the reacting model, e.g.
          "CH4:1.0" for a fuel injector. Required by the equilibrium model; ignored
          by the perfect-gas model. In "Declared" stream mode the entries are a
          blend over the declared streams instead, e.g. "H2:1".
      basis:
        label: Composition basis
        type: select
        defaultValue: mole
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: Whether the composition entries are mole or mass fractions.
        options:
          - { value: mole, label: Mole fractions }
          - { value: mass, label: Mass fractions }
      marker:
        label: Injectant is burnt gas
        type: boolean
        defaultValue: false
        category: Reacting
        visibleIf: { parameter: thermoModel, scope: model, equals: equilibrium }
        description: >-
          Whether the injected stream is already-burnt gas rather than fresh reactant. Off
          (default) injects fresh reactant (the normal case for an injector); On injects
          fully-burnt gas. Only used on an all-"Auto" (marker-gated) reacting network;
          ignored by the perfect-gas model.
    # Inline mass-injection element (a fuel injector when reacting). Conserves
    # mass / momentum / energy with the injection source terms; performs no
    # reaction itself -- ignition is the flame's job. Constant-area (both edges
    # must share one area).

  Orifice:
    displayName: Orifice
    category: Composite elements
    icon: BsRecordCircle
    shape: box
    glyph: orifice
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: Orifice
      throatArea:
        label: Throat area
        type: float
        defaultValue: 0.001
        unit: m^2
        category: Parameters
        min: 0.000001
        description: >-
          Orifice throat (vena-contracta plane) area. Keep it smaller than both attached
          edge areas for a genuine orifice; the flow accelerates isentropically to the
          throat and re-expands with the full Borda-Carnot mixing loss.
    # Composite: expands to IsentropicAreaChange -> SuddenAreaChange with an internal
    # throat edge at throatArea (the De Domenico assembly at maximum loss). Read the
    # throat state via solution.composite(<label>).throat_state.

  LossyNozzle:
    displayName: Lossy Nozzle
    category: Composite elements
    icon: BsFunnel
    shape: box
    glyph: lossy-nozzle
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: LossyNozzle
      throatArea:
        label: Throat area
        type: float
        defaultValue: 0.001
        unit: m^2
        category: Parameters
        min: 0.000001
        description: Nozzle throat area A_T (the minimum section; chokes first).
      beta:
        label: 'Jet area ratio $\beta$'
        type: float
        defaultValue: 0.7
        category: Parameters
        min: 0.01
        max: 1.0
        step: 0.01
        description: >-
          Jet-to-downstream area ratio A_j / A_2 in [A_T/A_2, 1]. It knobs the loss
          between the two physical limits: A_T/A_2 recovers the orifice (maximum loss)
          and 1 the lossless isentropic nozzle.
    # Composite: A1 ->isen-> AT ->isen-> Aj ->Borda-> A2 (general lossy nozzle,
    # De Domenico). Two internal edges at AT and Aj = beta * A2, where A2 is read
    # off the attached outflow edge at build time (areas live on edges).

  SuddenContraction:
    displayName: Sudden Contraction
    category: Composite elements
    icon: BsArrowsAngleContract
    shape: box
    glyph: sudden-contraction
    glyphInsetX: -0.02
    glyphInsetY: 0.05
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: SuddenContraction
      contractionCoefficient:
        label: Contraction coefficient $C_c$
        type: float
        defaultValue: 0.62
        category: Parameters
        min: 0.01
        max: 1.0
        step: 0.01
        description: >-
          Vena-contracta coefficient: the flow necks to C_c * A_2 just past the
          contraction plane before re-expanding to fill the pipe. 0.62 suits a
          sharp-edged contraction; 1 is the loss-free limit.
    # Composite: isentropic acceleration to the vena contracta (cc * A2, where A2 is
    # read off the attached outflow edge at build time) followed by a Borda-Carnot
    # re-expansion -- the compressible upgrade to SuddenAreaChange's cc-loss, exact at
    # higher Mach. Vena-contracta state via solution.composite(<label>).throat_state.

  HelmholtzResonator:
    displayName: Helmholtz Resonator
    category: Composite elements
    icon: BsSoundwave
    shape: box
    glyph: helmholtz-resonator
    glyphInsetX: -0.02
    glyphInsetY: 0.02
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: HelmholtzResonator
      volume:
        label: Cavity volume
        type: float
        defaultValue: 0.001
        unit: m^3
        category: Parameters
        min: 1e-9
        step: 0.0001
        description: Backing cavity volume V (the acoustic compliance).
      neckLength:
        label: Neck length
        type: float
        defaultValue: 0.05
        unit: m
        category: Parameters
        min: 0.000001
        step: 0.001
        description: >-
          Neck length (the acoustic inertance). Lengthen by an end correction to
          model the entrained near-field mass.
      neckArea:
        label: Neck area
        type: float
        defaultValue: 0.0005
        unit: m^2
        category: Parameters
        min: 0.000001
        step: 0.0001
        description: Neck cross-sectional area A_n.
    # Composite: a side-branch tee (junction) + neck duct + backing cavity hanging off
    # the main line, which passes straight through the tee. Resonates at
    # f0 = c * sqrt(A_n / (V * L_n)) / 2pi.

  FannoPipe:
    displayName: Fanno Pipe
    category: Composite elements
    icon: BsSegmentedNav
    shape: box
    glyph: fanno-pipe
    glyphInsetX: -0.02
    glyphInsetY: -0.02
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: FannoPipe
      length:
        label: Length
        type: float
        defaultValue: 1.0
        unit: m
        category: Parameters
        min: 0.000001
        step: 0.01
        description: Total pipe length L (friction length and acoustic propagation length).
      diameter:
        label: Hydraulic diameter
        type: float
        defaultValue: 0.05
        unit: m
        category: Parameters
        min: 0.000001
        step: 0.001
        description: >-
          Hydraulic diameter D for the friction term K = f L / D. The attached edge
          areas must equal pi D^2 / 4 for a circular pipe.
      frictionFactor:
        label: Darcy friction factor
        type: float
        defaultValue: 0.02
        category: Parameters
        min: 0
        step: 0.001
        description: Darcy friction factor f (e.g. 64/Re laminar, Haaland/Colebrook turbulent).
      nSegments:
        label: Segments
        type: number
        defaultValue: 8
        category: Parameters
        min: 1
        step: 1
        description: >-
          Number of chained pipe segments N -- a fidelity knob. The chain converges to
          the true distributed (Fanno) solution as N grows and resolves the Mach rise
          toward choke; 1 is the single lumped pipe. Size from the highest analysis
          frequency: N >= 12 * f_max * L / c.
    # Composite: a chain of N Pipe atoms, each L/N long, joined by internal edges (each
    # internal edge is an intermediate flow state). Per-segment states via
    # solution.composite(<label>).profile(<field>).

  TaperedDuct:
    displayName: Tapered Duct
    category: Composite elements
    icon: BsHourglass
    shape: box
    glyph: tapered-duct
    glyphInsetX: -0.02
    glyphInsetY: 0.02
    lockPorts: true
    dynamicPorts: false
    ports:
      target: ['0']
      source: ['1']
    parameters:
      label:
        defaultValue: TaperedDuct
      areaProfile:
        label: Area profile
        type: string
        defaultValue: ''
        category: Parameters
        required: true
        description: >-
          Station table of the area profile as "x:A" pairs separated by commas, e.g.
          "0:3e-3, 0.15:1.5e-3, 0.3:3e-3" (positions x in m, strictly increasing;
          areas A in m^2). Stations may be non-uniform -- cluster them where the area
          varies fastest, e.g. near a throat. The segment count is the number of
          stations minus one; the first/last areas must equal the attached edge areas.
    # Composite: discretizes a continuously area-varying passage (horn / con-di nozzle)
    # into per-station compact area changes + length-bearing ducts. A con-di profile
    # chokes at its true (minimum-area) station. Throat via
    # solution.composite(<label>).throat_state; profile via .profile(<field>).

  JunctionStaticP:
    displayName: Junction (static p)
    category: Multi port elements
    icon: BsLightningFill
    shape: circle
    glyph: junction
    dynamicPorts: true
    dynamicPortConfig:
      target:
        countParameter: leftPorts
        default: 2
        min: 1
      source:
        countParameter: rightPorts
        default: 1
        min: 1
    ports:
      target: []
      source: []
    parameters:
      label:
        defaultValue: Junction
      leftPorts:
        label: Target ports
        type: number
        defaultValue: 2
        min: 1
        step: 1
        category: Ports
        description: Number of target (incoming) ports
      rightPorts:
        label: Source ports
        type: number
        defaultValue: 1
        min: 1
        step: 1
        category: Ports
        description: Number of source (outgoing) ports
      volume:
        label: Chamber volume
        type: float
        defaultValue: 0.0
        unit: m^3
        category: Acoustics
        min: 0
        step: 0.0001
        description: >-
          Plenum/chamber volume. Gives the manifold the acoustic compliance
          C = V/(rho c^2) on its common pressure (storage block M) -- a junction with a
          volume is a cavity with through-flow. Default 0 = no compliance. Inert in the mean flow.
    # Common static pressure on all ports; inflow enthalpies mix mass-weighted.
    # A branch neck inertance is modeled as an explicit neck Duct off the manifold (as in a
    # Helmholtz resonator), not a manifold parameter.
    # Only valid where all port Mach numbers are low -- use LosslessSplitter for
    # plenums feeding fast branches.

  MixingJunction:
    displayName: Mixer
    category: Multi port elements
    icon: BsFunnelFill
    shape: circle
    glyph: mixing-junction
    dynamicPorts: true
    dynamicPortConfig:
      target:
        countParameter: leftPorts
        default: 2
        min: 1
      source:
        countParameter: rightPorts
        default: 1
        min: 1
    ports:
      target: []
      source: []
    parameters:
      label:
        defaultValue: Mixer
      leftPorts:
        label: Target ports
        type: number
        defaultValue: 2
        min: 1
        step: 1
        category: Ports
        description: Number of target (incoming) ports
      rightPorts:
        label: Source ports
        type: number
        defaultValue: 1
        min: 1
        step: 1
        category: Ports
        description: Number of source (outgoing) ports
      recovery:
        label: Dynamic-head recovery
        type: float
        defaultValue: 1.0
        category: Parameters
        min: 0
        max: 1
        step: 0.01
        description: >-
          Sets each inflow's mixing loss between the least-dissipative ideal (1, the
          default: the outlet leaves at the weakest feed's total pressure) and the full
          dump of its dynamic head (0, the robust plenum). At recovery 1 the mixer adds
          no flow resistance of its own, so each inflow must be pinned by the network
          (a prescribed rate or a branch resistance); lower it toward 0 for bare
          total-pressure feeds. Never manufactures total pressure (second law).
    # Common effective total pressure on all ports: each inflow gives up a mixing loss so
    # the node total pressure never rises above the feeds (entropy production >= 0). The
    # general merge -- valid at any port Mach number, unlike the static-p Junction -- and,
    # unlike the Splitter, it merges streams of unequal total pressure. Lengthless: no
    # chamber compliance (model a resonating plenum with a Junction or Cavity volume).

  LosslessSplitter:
