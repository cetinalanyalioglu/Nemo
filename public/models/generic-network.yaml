id: generic-network
name: Generic Network
description: Generic network model for testing and development.
forceUniqueNodeLabels: true

# Parameter sections (categories) sort alphabetically by default. Listing a
# category here pins it to the front; lower numbers appear first, and any
# category not listed follows alphabetically after the pinned ones. Here Text
# and Numeric are pinned ahead of the alphabetical default, so the Model pane
# shows: Text, Numeric, then Options (unlisted → alphabetical).
categoryPrecedence:
  Text: 1
  Numeric: 2

parameters:
  exampleFloat:
    label: Example Float
    type: float
    defaultValue: 1.5
    category: Numeric
    min: 0
    step: 0.1
    unit: m
    description: Floating-point model parameter
  exampleNumber:
    label: Example Number
    type: number
    defaultValue: 10
    category: Numeric
    min: 0
    step: 1
    description: Integer model parameter
  exampleString:
    label: Example String
    type: string
    defaultValue: default text
    category: Text
    description: Text model parameter
  exampleBoolean:
    label: Example Boolean
    type: boolean
    defaultValue: false
    category: Options
    description: Boolean model parameter

edges:
  generic:
    displayName: Generic Edge
    category: Generic Connections
    parameters: {}

'nodes':
  generic:
    displayName: Generic Node
    category: Dynamic Port Elements
    icon: BsLightningFill
    dynamicPorts: true
    dynamicPortConfig:
      target:
        countParameter: leftPorts
        default: 1
        min: 0
      source:
        countParameter: rightPorts
        default: 1
        min: 0
    ports:
      target: []
      source: []
    parameters:
      label:
        defaultValue: Node
      leftPorts:
        label: Target ports
        type: number
        defaultValue: 1
        min: 0
        step: 1
        category: Ports
        description: Number of target (incoming) ports
      rightPorts:
        label: Source ports
        type: number
        defaultValue: 1
        min: 0
        step: 1
        category: Ports
        description: Number of source (outgoing) ports
